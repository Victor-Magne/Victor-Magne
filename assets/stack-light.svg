<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 306" width="800" height="306" role="img" aria-label="Tech Stack — Victor Gomes">
  <defs>
    <linearGradient id="card-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f8fa" />
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .cat-title {
        font-size: 12px;
        font-weight: 600;
        fill: #57606a;
        letter-spacing: 0.4px;
      }
      .pill {
        fill: #ffffff;
        stroke: #d0d7de;
        stroke-width: 1;
      }
      .pill-text {
        font-size: 12px;
        font-weight: 500;
        fill: #1f2328;
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      .c1 { opacity: 0; animation: cardIn 0.45s ease-out 0.05s forwards; }
      .c2 { opacity: 0; animation: cardIn 0.45s ease-out 0.15s forwards; }
      .c3 { opacity: 0; animation: cardIn 0.45s ease-out 0.25s forwards; }
      .c4 { opacity: 0; animation: cardIn 0.45s ease-out 0.35s forwards; }
      .c5 { opacity: 0; animation: cardIn 0.45s ease-out 0.45s forwards; }
      .dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: dotPulse 2.6s ease-in-out infinite;
      }
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: 0.4s; }
      .d3 { animation-delay: 0.8s; }
      .d4 { animation-delay: 1.2s; }
      .d5 { animation-delay: 1.6s; }
    </style>
  </defs>

  <!-- Card 1: Backend -->
  <g class="c1">
    <rect x="1" y="1" width="390" height="112" rx="10" fill="url(#card-bg-light)" stroke="#d0d7de" stroke-width="1.2" />
    <circle cx="20" cy="22" r="4" fill="#FF2D20" class="dot d1" />
    <text x="32" y="26" class="mono cat-title">// BACKEND</text>

    <rect x="18" y="40" width="72" height="26" rx="6" class="pill" />
    <circle cx="31" cy="53" r="4" fill="#777BB4" />
    <text x="41" y="57" class="sans pill-text">PHP</text>

    <rect x="98" y="40" width="90" height="26" rx="6" class="pill" />
    <circle cx="111" cy="53" r="4" fill="#FF2D20" />
    <text x="121" y="57" class="sans pill-text">Laravel</text>

    <rect x="196" y="40" width="96" height="26" rx="6" class="pill" />
    <circle cx="209" cy="53" r="4" fill="#FDAE4B" />
    <text x="219" y="57" class="sans pill-text">Filament</text>

    <rect x="18" y="74" width="94" height="26" rx="6" class="pill" />
    <circle cx="31" cy="87" r="4" fill="#4E56A6" />
    <text x="41" y="91" class="sans pill-text">Livewire</text>

    <rect x="120" y="74" width="108" height="26" rx="6" class="pill" />
    <circle cx="133" cy="87" r="4" fill="#885630" />
    <text x="143" y="91" class="sans pill-text">Composer</text>
  </g>

  <!-- Card 2: Systems & Desktop -->
  <g class="c2">
    <rect x="409" y="1" width="390" height="112" rx="10" fill="url(#card-bg-light)" stroke="#d0d7de" stroke-width="1.2" />
    <circle cx="428" cy="22" r="4" fill="#ea580c" class="dot d2" />
    <text x="440" y="26" class="mono cat-title">// SYSTEMS &amp; DESKTOP</text>

    <rect x="426" y="40" width="76" height="26" rx="6" class="pill" />
    <circle cx="439" cy="53" r="4" fill="#1f2328" />
    <text x="449" y="57" class="sans pill-text">Rust</text>

    <rect x="510" y="40" width="84" height="26" rx="6" class="pill" />
    <circle cx="523" cy="53" r="4" fill="#ea580c" />
    <text x="533" y="57" class="sans pill-text">Cargo</text>

    <rect x="602" y="40" width="100" height="26" rx="6" class="pill" />
    <circle cx="615" cy="53" r="4" fill="#0078D4" />
    <text x="625" y="57" class="sans pill-text">Windows</text>

    <rect x="426" y="74" width="80" height="26" rx="6" class="pill" />
    <circle cx="439" cy="87" r="4" fill="#eab308" />
    <text x="449" y="91" class="sans pill-text">Linux</text>
  </g>

  <!-- Card 3: Frontend -->
  <g class="c3">
    <rect x="1" y="125" width="390" height="92" rx="10" fill="url(#card-bg-light)" stroke="#d0d7de" stroke-width="1.2" />
    <circle cx="20" cy="146" r="4" fill="#0891b2" class="dot d3" />
    <text x="32" y="150" class="mono cat-title">// FRONTEND</text>

    <rect x="18" y="168" width="108" height="26" rx="6" class="pill" />
    <circle cx="31" cy="181" r="4" fill="#eab308" />
    <text x="41" y="185" class="sans pill-text">JavaScript</text>

    <rect x="134" y="168" width="82" height="26" rx="6" class="pill" />
    <circle cx="147" cy="181" r="4" fill="#FF2D20" />
    <text x="157" y="185" class="sans pill-text">Blade</text>

    <rect x="224" y="168" width="124" height="26" rx="6" class="pill" />
    <circle cx="237" cy="181" r="4" fill="#06B6D4" />
    <text x="247" y="185" class="sans pill-text">Tailwind CSS</text>
  </g>

  <!-- Card 4: Data & Infra -->
  <g class="c4">
    <rect x="409" y="125" width="390" height="180" rx="10" fill="url(#card-bg-light)" stroke="#d0d7de" stroke-width="1.2" />
    <circle cx="428" cy="146" r="4" fill="#0284c7" class="dot d4" />
    <text x="440" y="150" class="mono cat-title">// DATA &amp; INFRA</text>

    <rect x="426" y="168" width="114" height="26" rx="6" class="pill" />
    <circle cx="439" cy="181" r="4" fill="#4169E1" />
    <text x="449" y="185" class="sans pill-text">PostgreSQL</text>

    <rect x="548" y="168" width="88" height="26" rx="6" class="pill" />
    <circle cx="561" cy="181" r="4" fill="#4479A1" />
    <text x="571" y="185" class="sans pill-text">MySQL</text>

    <rect x="644" y="168" width="86" height="26" rx="6" class="pill" />
    <circle cx="657" cy="181" r="4" fill="#0284c7" />
    <text x="667" y="185" class="sans pill-text">SQLite</text>

    <rect x="426" y="204" width="82" height="26" rx="6" class="pill" />
    <circle cx="439" cy="217" r="4" fill="#FF4438" />
    <text x="449" y="221" class="sans pill-text">Redis</text>

    <rect x="516" y="204" width="92" height="26" rx="6" class="pill" />
    <circle cx="529" cy="217" r="4" fill="#2496ED" />
    <text x="539" y="221" class="sans pill-text">Docker</text>

    <rect x="616" y="204" width="136" height="26" rx="6" class="pill" />
    <circle cx="629" cy="217" r="4" fill="#2088FF" />
    <text x="639" y="221" class="sans pill-text">GitHub Actions</text>

    <text x="426" y="276" class="mono" font-size="11" fill="#6e7781">containers · CI/CD · relational &amp; cache</text>
  </g>

  <!-- Card 5: Quality -->
  <g class="c5">
    <rect x="1" y="229" width="390" height="76" rx="10" fill="url(#card-bg-light)" stroke="#d0d7de" stroke-width="1.2" />
    <circle cx="20" cy="250" r="4" fill="#16a34a" class="dot d5" />
    <text x="32" y="254" class="mono cat-title">// QUALITY</text>

    <rect x="18" y="268" width="76" height="26" rx="6" class="pill" />
    <circle cx="31" cy="281" r="4" fill="#F05340" />
    <text x="41" y="285" class="sans pill-text">Pest</text>

    <rect x="102" y="268" width="98" height="26" rx="6" class="pill" />
    <circle cx="115" cy="281" r="4" fill="#777BB4" />
    <text x="125" y="285" class="sans pill-text">PHPUnit</text>
  </g>
</svg>

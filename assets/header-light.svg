<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Victor Gomes — Full-Stack Developer">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f8fa" />
    </linearGradient>
    <linearGradient id="accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.85); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .cursor {
        animation: blink 1.1s infinite;
      }
      .status-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 2.2s ease-in-out infinite;
      }
      .line-1 { animation: fadeUp 0.5s ease-out forwards; }
      .line-2 { opacity: 0; animation: fadeUp 0.5s ease-out 0.15s forwards; }
      .line-3 { opacity: 0; animation: fadeUp 0.5s ease-out 0.3s forwards; }
    </style>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="798" height="218" rx="12" fill="url(#bg-light)" stroke="#d0d7de" stroke-width="1.5" />

  <!-- Top accent bar -->
  <rect x="1" y="1" width="798" height="3" rx="1.5" fill="url(#accent-light)" />

  <!-- Terminal window bar -->
  <circle cx="28" cy="28" r="5.5" fill="#ff5f56" />
  <circle cx="48" cy="28" r="5.5" fill="#ffbd2e" />
  <circle cx="68" cy="28" r="5.5" fill="#27c93f" />
  <text x="400" y="32" text-anchor="middle" class="mono" font-size="12" fill="#57606a">~/victor-magne — zsh</text>

  <!-- Status pill -->
  <rect x="596" y="17" width="180" height="22" rx="11" fill="#eef2f6" stroke="#d0d7de" stroke-width="1" />
  <circle cx="612" cy="28" r="4" fill="#16a34a" class="status-dot" />
  <text x="624" y="32" class="mono" font-size="11" fill="#24292f">open to collaborate</text>

  <!-- Divider -->
  <line x1="20" y1="48" x2="780" y2="48" stroke="#e5e7eb" stroke-width="1" />

  <!-- Prompt -->
  <text x="32" y="80" class="mono line-1" font-size="13" fill="#0284c7">$ whoami</text>

  <!-- Main Name + Cursor -->
  <text x="32" y="124" class="sans line-1" font-size="38" font-weight="700" fill="#1f2328" letter-spacing="-0.5">
    Victor Gomes<tspan class="mono cursor" fill="#0284c7">_</tspan>
  </text>

  <!-- Role -->
  <text x="32" y="156" class="mono line-2" font-size="15" font-weight="600" fill="#ea580c">
    Full-Stack Developer <tspan fill="#57606a">·</tspan> <tspan fill="#4f46e5">PHP</tspan> <tspan fill="#57606a">·</tspan> <tspan fill="#dc2626">Laravel</tspan> <tspan fill="#57606a">·</tspan> <tspan fill="#1f2328">Rust</tspan>
  </text>

  <!-- Tagline -->
  <text x="32" y="186" class="sans line-3" font-size="14" fill="#57606a">
    I build robust web systems &amp; native tools with clean code and tests.
  </text>
</svg>

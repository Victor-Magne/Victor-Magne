<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 232" width="800" height="232" role="img" aria-label="Victor Gomes — Full-Stack Developer">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      @keyframes typeReveal {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0% 0 0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.85); }
      }

      .type-name {
        clip-path: inset(0 100% 0 0);
        animation: typeReveal 1.0s steps(12, end) 0.2s forwards;
      }
      .type-role1 {
        clip-path: inset(0 100% 0 0);
        animation: typeReveal 1.5s steps(36, end) 1.35s forwards;
      }
      .type-role2 {
        clip-path: inset(0 100% 0 0);
        animation: typeReveal 1.6s steps(45, end) 2.95s forwards;
      }
      .type-tag {
        opacity: 0;
        animation: fadeIn 0.6s ease-out 4.6s forwards;
      }
      .cursor {
        opacity: 0;
        animation: blink 1s infinite 4.6s;
      }
      .status-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 2.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="798" height="230" rx="12" fill="url(#bg-dark)" stroke="#30363d" stroke-width="1.5" />

  <!-- Top accent bar -->
  <rect x="1" y="1" width="798" height="3" rx="1.5" fill="url(#accent-dark)" />

  <!-- Terminal window bar -->
  <circle cx="28" cy="26" r="5.5" fill="#ff5f56" />
  <circle cx="48" cy="26" r="5.5" fill="#ffbd2e" />
  <circle cx="68" cy="26" r="5.5" fill="#27c93f" />
  <text x="400" y="30" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">~/victor-magne — zsh</text>

  <!-- Status pill -->
  <rect x="596" y="15" width="180" height="22" rx="11" fill="#1f2937" stroke="#30363d" stroke-width="1" />
  <circle cx="612" cy="26" r="4" fill="#22c55e" class="status-dot" />
  <text x="624" y="30" class="mono" font-size="11" fill="#c9d1d9">open to collaborate</text>

  <!-- Divider -->
  <line x1="20" y1="46" x2="780" y2="46" stroke="#21262d" stroke-width="1" />

  <!-- Prompt -->
  <text x="32" y="74" class="mono" font-size="12.5" fill="#38bdf8">$ whoami</text>

  <!-- 1. Name typed -->
  <text x="32" y="114" class="mono type-name" font-size="34" font-weight="700" fill="#f0f6fc">Victor Gomes</text>

  <!-- 2. Full-Stack PHP & Laravel typed -->
  <text x="32" y="146" class="mono type-role1" font-size="14.5" font-weight="600" fill="#f97316">
    &gt; Full-Stack Developer <tspan fill="#8b949e">·</tspan> <tspan fill="#a5b4fc">PHP</tspan> <tspan fill="#8b949e">&amp;</tspan> <tspan fill="#f87171">Laravel</tspan>
  </text>

  <!-- 3. Rust & ClaudTray typed -->
  <text x="32" y="172" class="mono type-role2" font-size="14.5" font-weight="600" fill="#38bdf8">
    &gt; Rust <tspan fill="#8b949e">·</tspan> <tspan fill="#e2e8f0">Systems &amp; Desktop</tspan> <tspan fill="#8b949e">·</tspan> <tspan fill="#22c55e">Building ClaudTray</tspan>
  </text>

  <!-- 4. Tagline + blinking cursor -->
  <text x="32" y="204" class="sans type-tag" font-size="13.5" fill="#8b949e">
    I build robust web systems &amp; native tools with clean code and tests.<tspan class="mono cursor" fill="#38bdf8"> _</tspan>
  </text>
</svg>

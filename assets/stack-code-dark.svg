<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Loading packages — Victor Gomes Tech Stack">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="bar-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .ln { font-size: 12px; fill: #484f58; }
      .kw { font-size: 12.5px; fill: #ff7b72; }
      .id { font-size: 12.5px; fill: #d2a8ff; }
      .op { font-size: 12.5px; fill: #8b949e; }
      .key { font-size: 12.5px; fill: #79c0ff; }
      .str { font-size: 12.5px; fill: #a5d6ff; }
      .ok { font-size: 12px; fill: #3fb950; font-weight: 700; }

      @keyframes progressLoop {
        0% { transform: scaleX(0.02); }
        10% { transform: scaleX(0.2); }
        20% { transform: scaleX(0.4); }
        30% { transform: scaleX(0.6); }
        40% { transform: scaleX(0.8); }
        50%, 92% { transform: scaleX(1); }
        97%, 100% { transform: scaleX(0.02); }
      }
      @keyframes row1 {
        0%, 4% { opacity: 0; transform: translateX(-6px); }
        9%, 92% { opacity: 1; transform: translateX(0); }
        97%, 100% { opacity: 0; transform: translateX(-6px); }
      }
      @keyframes row2 {
        0%, 14% { opacity: 0; transform: translateX(-6px); }
        19%, 92% { opacity: 1; transform: translateX(0); }
        97%, 100% { opacity: 0; transform: translateX(-6px); }
      }
      @keyframes row3 {
        0%, 24% { opacity: 0; transform: translateX(-6px); }
        29%, 92% { opacity: 1; transform: translateX(0); }
        97%, 100% { opacity: 0; transform: translateX(-6px); }
      }
      @keyframes row4 {
        0%, 34% { opacity: 0; transform: translateX(-6px); }
        39%, 92% { opacity: 1; transform: translateX(0); }
        97%, 100% { opacity: 0; transform: translateX(-6px); }
      }
      @keyframes row5 {
        0%, 44% { opacity: 0; transform: translateX(-6px); }
        49%, 92% { opacity: 1; transform: translateX(0); }
        97%, 100% { opacity: 0; transform: translateX(-6px); }
      }
      @keyframes doneRow {
        0%, 50% { opacity: 0; }
        55%, 92% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes spinDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      .progress-fill {
        transform-box: fill-box;
        transform-origin: left center;
        animation: progressLoop 12s ease-in-out infinite;
      }
      .r1 { animation: row1 12s ease-out infinite; }
      .r2 { animation: row2 12s ease-out infinite; }
      .r3 { animation: row3 12s ease-out infinite; }
      .r4 { animation: row4 12s ease-out infinite; }
      .r5 { animation: row5 12s ease-out infinite; }
      .rdone { animation: doneRow 12s ease-out infinite; }
      .cursor { animation: blink 1s infinite; }
      .live-dot { animation: spinDot 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="798" height="328" rx="12" fill="url(#bg-dark)" stroke="#30363d" stroke-width="1.5" />

  <!-- Top window bar -->
  <circle cx="24" cy="22" r="5" fill="#ff5f56" />
  <circle cx="42" cy="22" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="22" r="5" fill="#27c93f" />
  <text x="400" y="26" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">stack.ts — loading packages</text>
  <circle cx="712" cy="22" r="3.5" fill="#38bdf8" class="live-dot" />
  <text x="722" y="26" class="mono" font-size="11" fill="#8b949e">20 pkgs</text>

  <line x1="16" y1="40" x2="784" y2="40" stroke="#21262d" stroke-width="1" />

  <!-- Command & Progress bar -->
  <text x="24" y="64" class="mono" font-size="12.5" fill="#38bdf8">$ <tspan fill="#e6edf3">load-stack</tspan> <tspan fill="#8b949e">--env=production --verify</tspan></text>
  <rect x="24" y="76" width="752" height="5" rx="2.5" fill="#21262d" />
  <rect x="24" y="76" width="752" height="5" rx="2.5" fill="url(#bar-dark)" class="progress-fill" />

  <!-- Code lines -->
  <!-- 01 -->
  <text x="24" y="114" class="mono ln">01</text>
  <text x="52" y="114" class="mono"><tspan class="kw">const</tspan> <tspan class="id">stack</tspan> <tspan class="op">= {</tspan></text>

  <!-- 02 Backend -->
  <g class="r1">
    <text x="24" y="142" class="mono ln">02</text>
    <text x="68" y="142" class="mono"><tspan class="key">backend</tspan><tspan class="op">:    [</tspan> <tspan class="str">"PHP"</tspan><tspan class="op">,</tspan> <tspan class="str">"Laravel"</tspan><tspan class="op">,</tspan> <tspan class="str">"Filament"</tspan><tspan class="op">,</tspan> <tspan class="str">"Livewire"</tspan><tspan class="op">,</tspan> <tspan class="str">"Composer"</tspan> <tspan class="op">],</tspan></text>
    <text x="764" y="142" class="mono ok">✓</text>
  </g>

  <!-- 03 Systems -->
  <g class="r2">
    <text x="24" y="170" class="mono ln">03</text>
    <text x="68" y="170" class="mono"><tspan class="key">systems</tspan><tspan class="op">:    [</tspan> <tspan class="str">"Rust"</tspan><tspan class="op">,</tspan> <tspan class="str">"Cargo"</tspan><tspan class="op">,</tspan> <tspan class="str">"Windows"</tspan><tspan class="op">,</tspan> <tspan class="str">"Linux"</tspan> <tspan class="op">],</tspan></text>
    <text x="764" y="170" class="mono ok">✓</text>
  </g>

  <!-- 04 Frontend -->
  <g class="r3">
    <text x="24" y="198" class="mono ln">04</text>
    <text x="68" y="198" class="mono"><tspan class="key">frontend</tspan><tspan class="op">:   [</tspan> <tspan class="str">"JavaScript"</tspan><tspan class="op">,</tspan> <tspan class="str">"Blade"</tspan><tspan class="op">,</tspan> <tspan class="str">"Tailwind CSS"</tspan> <tspan class="op">],</tspan></text>
    <text x="764" y="198" class="mono ok">✓</text>
  </g>

  <!-- 05 Data & Infra -->
  <g class="r4">
    <text x="24" y="226" class="mono ln">05</text>
    <text x="68" y="226" class="mono"><tspan class="key">data_infra</tspan><tspan class="op">: [</tspan> <tspan class="str">"PostgreSQL"</tspan><tspan class="op">,</tspan> <tspan class="str">"MySQL"</tspan><tspan class="op">,</tspan> <tspan class="str">"SQLite"</tspan><tspan class="op">,</tspan> <tspan class="str">"Redis"</tspan><tspan class="op">,</tspan> <tspan class="str">"Docker"</tspan><tspan class="op">,</tspan> <tspan class="str">"GitHub Actions"</tspan> <tspan class="op">],</tspan></text>
    <text x="764" y="226" class="mono ok">✓</text>
  </g>

  <!-- 06 Quality -->
  <g class="r5">
    <text x="24" y="254" class="mono ln">06</text>
    <text x="68" y="254" class="mono"><tspan class="key">quality</tspan><tspan class="op">:    [</tspan> <tspan class="str">"Pest"</tspan><tspan class="op">,</tspan> <tspan class="str">"PHPUnit"</tspan> <tspan class="op">],</tspan></text>
    <text x="764" y="254" class="mono ok">✓</text>
  </g>

  <!-- 07 -->
  <text x="24" y="282" class="mono ln">07</text>
  <text x="52" y="282" class="mono op">};</text>

  <!-- Footer status -->
  <line x1="16" y1="296" x2="784" y2="296" stroke="#21262d" stroke-width="1" />
  <g class="rdone">
    <text x="24" y="316" class="mono" font-size="11.5" fill="#3fb950">✓ <tspan fill="#8b949e">5 modules, 20 packages loaded</tspan><tspan class="cursor" fill="#38bdf8"> _</tspan></text>
  </g>
</svg>
